<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Sharer Community</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
        #search { width: 80%; max-width: 400px; margin-bottom: 20px; }
        .upload-form input { width: 85%; }
        .upload-form button { background: #4CAF50; color: white; border: none; cursor: pointer; width: 90%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.05); background: #eef; }
        .emoji { font-size: 28px; display: block; margin-bottom: 8px; word-break: break-all; }
        .tag { font-size: 12px; color: #666; text-transform: capitalize; }
    </style>
</head>
<body>

    <h1>📱 Emoji Sharer 💬</h1>

    <!-- Upload Form Panel -->
    <div class="container upload-form">
        <h3>Submit a New Emoji / Text Combo</h3>
        <input type="text" id="newEmoji" placeholder="Paste emoji or combo (e.g. 👁️👄👁️ or 🍉)">
        <input type="text" id="newTags" placeholder="Keywords/Tags (e.g. funny, face, summer)">
        <button onclick="submitEmoji()">Upload to Feed</button>
    </div>

    <!-- Search Tool -->
    <input type="text" id="search" placeholder="Search community emojis..." onkeyup="searchEmojis()">
    
    <div class="grid" id="emojiGrid"></div>

    <script>
        // Array to simulate storage until a backend script is linked
        let localDatabase = [
            { char: "🔥", tags: "fire hot flame popular" },
            { char: "👁️👄👁️", tags: "face shock surprise meme" },
            { char: "🐱", tags: "cat animal cute" }
        ];

        function renderEmojis(data) {
            const grid = document.getElementById("emojiGrid");
            grid.innerHTML = data.map(item => `
                <div class="card" onclick="copyEmoji('${item.char}')">
                    <span class="emoji">${item.char}</span>
                    <span class="tag">${item.tags}</span>
                </div>
            `).join('');
        }

        function submitEmoji() {
            const emojiInput = document.getElementById("newEmoji").value.trim();
            const tagsInput = document.getElementById("newTags").value.trim().toLowerCase();

            if (!emojiInput || !tagsInput) {
                alert("Please fill in both fields!");
                return;
            }

            // Add the new submission directly into our temporary database array
            localDatabase.unshift({ char: emojiInput, tags: tagsInput });
            
            // Refresh screen view
            renderEmojis(localDatabase);

            // Clear inputs
            document.getElementById("newEmoji").value = "";
            document.getElementById("newTags").value = "";
            
            alert("Success! Added to live view.");
        }

        function searchEmojis() {
            const query = document.getElementById("search").value.toLowerCase();
            const filtered = localDatabase.filter(item => item.tags.includes(query) || item.char.includes(query));
            renderEmojis(filtered);
        }

        function copyEmoji(emoji) {
            navigator.clipboard.writeText(emoji);
            alert(`Copied to clipboard: ${emoji}`);
        }

        // Run application on start
        renderEmojis(localDatabase);
    </script>
</body>
</html>
